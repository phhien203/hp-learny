fuse:
  dir: '${LITEFS_DIR}'

data:
  dir: '/data/litefs'

lease:
  type: 'consul'
  candidate: true
  advertise-url: 'http://${HOSTNAME}.vm.${FLY_APP_NAME}.internal:20202'

  consul:
    url: '${FLY_CONSUL_URL}'
    # ref https://fly.io/docs/litefs/disaster-recovery/#resolve-consul-key-error
    key: 'litefs/${FLY_APP_NAME}-v2'
